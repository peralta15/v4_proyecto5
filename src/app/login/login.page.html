<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <div class="login-container">
    <ion-img src="assets/icon/logo.png" class="logo" *ngIf="!isLoading"></ion-img>
    
    <form (ngSubmit)="ingresar()" class="ion-margin-top">
      <ion-list>
        <ion-item lines="full" class="ion-margin-bottom">
          <ion-icon slot="start" name="mail-outline"></ion-icon>
          <ion-label position="floating">Correo Electrónico</ion-label>
          <ion-input 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            required
            autocomplete="email"
            inputmode="email"
            clearInput>
          </ion-input>
        </ion-item>

        <ion-item lines="full" class="ion-margin-bottom">
          <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            required
            autocomplete="current-password"
            clearInput>
          </ion-input>
        </ion-item>
      </ion-list>

      <ion-button 
        type="submit" 
        expand="block" 
        fill="clear"
        shape="round"
        [disabled]="isLoading || !email || !password"
        class="ion-margin-top login-button">
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <ion-text *ngIf="!isLoading">Ingresar</ion-text>
      </ion-button>

      <div class="ion-text-center ion-margin-top">
        <ion-button (click)="irARegistro()" fill="clear" size="circle" class="register-button">
          ¿No tienes cuenta? <strong> Regístrate</strong>
        </ion-button>
      </div>
    </form>
  </div>
</ion-content>
